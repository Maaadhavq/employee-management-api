# Reverse proxy: public port 80 -> Gunicorn on 127.0.0.1:8000.
# Install to /etc/nginx/sites-available/employee-api and symlink into
# sites-enabled (see deploy/bootstrap.sh).
server {
    listen 80 default_server;
    server_name _;

    # Allow reasonably sized request bodies (JSON payloads are tiny; this is
    # headroom).
    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
